<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="240" height="240" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs>
<linearGradient id="frameG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2A2D33"/><stop offset="1" stop-color="#0E0F12"/></linearGradient>
<linearGradient id="glassG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6FE3B4"/><stop offset="1" stop-color="#0F9D6D"/></linearGradient>
<radialGradient id="glowM" cx="50%" cy="50%" r="60%"><stop offset="0" stop-color="#CFFCEA" stop-opacity=".95"/><stop offset="1" stop-color="#3FE0A5" stop-opacity="0"/></radialGradient>
</defs><g stroke-linejoin="round">
<!-- handle -->
<path d="M42 30 C42 14, 78 14, 78 30" fill="none" stroke="url(#frameG)" stroke-width="5" stroke-linecap="round"/>
<!-- top cap -->
<polygon points="46,30 74,30 80,40 40,40" fill="url(#frameG)"/>
<rect x="55" y="24" width="10" height="8" rx="1.5" fill="url(#frameG)"/>
<!-- body frame outer -->
<rect x="34" y="40" width="52" height="56" rx="6" fill="url(#frameG)"/>
<!-- glass chamber inset -->
<rect x="41" y="47" width="38" height="42" rx="3" fill="url(#glassG)"/>
<circle cx="60" cy="68" r="15" fill="url(#glowM)"/>
<!-- corner support posts (visible frame over glass) -->
<rect x="41" y="47" width="4" height="42" fill="url(#frameG)"/>
<rect x="75" y="47" width="4" height="42" fill="url(#frameG)"/>
<!-- horizontal frame bands -->
<rect x="34" y="47" width="52" height="4" fill="url(#frameG)"/>
<rect x="34" y="85" width="52" height="4" fill="url(#frameG)"/>
<!-- center light core -->
<polygon points="60,58 68,68 60,78 52,68" fill="#EAFFF6"/>
<!-- base -->
<rect x="28" y="96" width="64" height="10" rx="3" fill="url(#frameG)"/>
<rect x="38" y="106" width="44" height="6" rx="2" fill="url(#frameG)"/>
</g></svg>
